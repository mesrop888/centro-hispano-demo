# Render Blueprint: runs server.py as a free web service (Python standard library only).
# Render → New → Blueprint → pick this repository.
services:
  - type: web
    name: centro-hispano
    runtime: python
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: python server.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
